name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # #[sqlx::test] creates a temporary database per test using this connection
    # as an administrative database, so the CI user must be allowed to CREATE DATABASE.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres@localhost:5432/postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - name: Verify formatting
        run: cargo fmt --all --check

      - name: Lint API and shared crate
        run: cargo clippy --locked --workspace --exclude ui --all-targets -- -D warnings

      - name: Test API and shared crate
        run: cargo test --locked --workspace --exclude ui

      - name: Lint Dioxus SSR server
        run: cargo clippy --locked -p ui --no-default-features --features server --all-targets -- -D warnings

      - name: Lint Dioxus web client
        run: cargo clippy --locked -p ui --no-default-features --features web --target wasm32-unknown-unknown -- -D warnings

  containers:
    name: Build ${{ matrix.name }} image
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            dockerfile: apps/api/Dockerfile
            cache_scope: api
          - name: UI SSR
            dockerfile: apps/ui/Dockerfile
            cache_scope: ui

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,scope=${{ matrix.cache_scope }},mode=max

