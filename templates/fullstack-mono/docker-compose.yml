services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/app
      RUST_LOG: api=info,tower_http=info
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  ui:
    build:
      context: .
      dockerfile: apps/ui/Dockerfile
    environment:
      API_URL: http://api:3001
      IP: 0.0.0.0
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  test:
    image: rust:1.96.1-slim-bookworm
    profiles: ["test"]
    working_dir: /app
    command: >-
      sh -c "cargo test --locked --workspace --exclude ui &&
      cargo check --locked -p ui --no-default-features --features server"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/app_test
    volumes:
      - .:/app
      - cargo-registry:/usr/local/cargo/registry
      - test-target:/app/target
    depends_on:
      postgres-test:
        condition: service_healthy

  postgres-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: app_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  postgres-data:
  cargo-registry:
  test-target:
