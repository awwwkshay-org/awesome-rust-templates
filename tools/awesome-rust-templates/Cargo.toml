[package]
name = "awesome-rust-templates"
version = "0.3.0"
edition.workspace = true
license.workspace = true
description = "Create a project from the fullstack-mono template"
publish = false

[[bin]]
name = "art"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
flate2 = "1"
sha2 = "0.11"
tar = "0.4"
ureq = "3.3"

[dev-dependencies]
tempfile = "3"
walkdir = "2"
