[package]
name = "awesome-rust-templates"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Create a project from the fullstack-mono template"
publish = false

[[bin]]
name = "art"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
tar = "0.4"

[build-dependencies]
flate2 = "1"
tar = "0.4"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
